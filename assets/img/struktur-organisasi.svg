<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 836" role="img" aria-labelledby="bagan-t bagan-d">
<title id="bagan-t">Bagan Struktur Organisasi Universitas Nusa Megarkencana</title>
<desc id="bagan-d">Yayasan membawahi Rektor; Satuan Pengawas Internal dan Dewan Pertimbangan dalam garis koordinasi. Rektor dibantu Wakil Rektor 1, 2, dan 3, bersama Senat dan Lembaga Penjaminan Mutu. Unit: BAAK, BAU &amp; Keuangan, Perpustakaan, LPPM, Lembaga Pusat Karir, Lembaga Kerjasama, PKBK. Fakultas Teknik dan Informatika (Program Studi Sistem Informasi, Informatika, Teknik Sipil) dan Fakultas Ekonomi dan Bisnis (Program Studi Manajemen, Akuntansi); tiap program studi memiliki Ketua Program Studi, Kepala Laboratorium, dan Laboratorium. Penjaminan mutu: Lembaga Penjaminan Mutu, UPMF, UPMP.</desc>
