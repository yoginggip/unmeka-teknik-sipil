<section class="page-head"><div class="bg" style="background-image:url(assets/img/web/article-03.jpg)"></div><div class="container">

<script src="assets/js/flair.js?v=20261102n" defer></script>
<script>
window.pageInit = function () {
  const all = getPengumuman();
  const id = +new URLSearchParams(location.search).get("id");
  const v = $("#view");
  const note = all.some(p => p.contoh) ? `<p class="job-note">${ic("info")}<span>Pengumuman bertanda <b>Contoh</b> adalah data peraga. Pengumuman resmi diunggah oleh admin program studi melalui panel admin.</span></p>` : "";
  if (id) {
    const p = all.find(x => x.id === id);
    if (!p) { v.innerHTML = `<p class="empty">Pengumuman tidak ditemukan. <a class="link" href="pengumuman.html">Kembali ke daftar pengumuman</a></p>`; return; }
    document.title = `${p.judul} | Teknik Sipil UNMEKA`;
    $("#crumb").innerHTML = `<a href="index.html">Beranda</a><span aria-hidden="true">/</span><a href="pengumuman.html">Pengumuman</a><span aria-hidden="true">/</span><span>${esc(p.kategori)}</span>`;
    $("#title").textContent = p.judul;
    $("#sub").innerHTML = `${esc(p.kategori)} &middot; ${fmtDate(p.tanggal)}`;
    v.innerHTML = `${p.contoh ? note : ""}<article class="article">${p.isi.split("\n").filter(Boolean).map(x => `<p>${esc(x)}</p>`).join("")}
      <div class="article-foot"><a class="link" href="pengumuman.html" id="back">${ic("arrow")} Semua pengumuman</a></div></article>`;
    $("#back .icon").style.transform = "rotate(180deg)";
    return;
  }
  const kats = ["Semua", ...new Set(all.map(p => p.kategori))];
  let f = "Semua";
  v.innerHTML = `${note}<div class="toolbar">
      <div class="chips" id="k">${kats.map(k => `<button class="chip" data-k="${k}">${k}</button>`).join("")}</div>
      <label class="search"><span class="sr-only">Cari pengumuman</span>${ic("search")}<input class="input" id="q" type="search" placeholder="Cari pengumuman"></label>
    </div><div class="ann-list" id="g"></div><p class="empty" id="e" hidden>Tidak ada pengumuman yang sesuai.</p>`;
  const render = () => {
    const q = $("#q").value.trim().toLowerCase();
    $$("#k .chip").forEach(c => c.classList.toggle("on", c.dataset.k === f));
    const list = all.filter(p => (f === "Semua" || p.kategori === f) && p.judul.toLowerCase().includes(q));
    $("#e").hidden = list.length > 0;
    $("#g").innerHTML = list.map(annItem).join("");
    $$("#g .reveal").forEach(el => el.classList.add("in"));
  };
  $("#k").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { f = c.dataset.k; render(); } });
  $("#q").addEventListener("input", render);
  render();
};
</script>
