<body>
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="bg" style="background-image:url(assets/img/web/page-title-bg-sipil.jpg)"></div><div class="container">
  <nav class="crumb" aria-label="Breadcrumb" id="crumb"><a href="index.html">Beranda</a><span aria-hidden="true">/</span><span>Karier</span></nav>
  <h1 id="title">Karier &amp; Lowongan</h1>
  <p id="sub">Lowongan kerja dan magang di bidang teknik sipil untuk mahasiswa dan alumni.</p>
</div></section>
<section class="section"><div class="container" id="view"></div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js?v=20261102n"></script>
<script src="assets/js/app.js?v=20261102n"></script>
<script src="assets/js/fx.js" defer></script>
<script src="assets/js/flair.js?v=20261102n" defer></script>
<script>
window.pageInit = function () {
  const all = getLowongan();
  const id = +new URLSearchParams(location.search).get("id");
  const v = $("#view");
  const note = all.some(l => l.contoh) ? `<p class="job-note">${ic("info")}<span>Lowongan bertanda <b>Contoh</b> adalah data peraga. Lowongan resmi diunggah oleh admin program studi melalui panel admin.</span></p>` : "";

  if (id) {
    const l = getLowongan(true).find(x => x.id === id);
    if (!l) { v.innerHTML = `<p class="empty">Lowongan tidak ditemukan. <a class="link" href="karier.html">Kembali ke daftar lowongan</a></p>`; return; }
    const lewat = l.batas && l.batas < today();
    document.title = `${l.posisi} | Karier Teknik Sipil UNMEKA`;
    $("#crumb").innerHTML = `<a href="index.html">Beranda</a><span aria-hidden="true">/</span><a href="karier.html">Karier</a><span aria-hidden="true">/</span><span>${esc(l.jenis)}</span>`;
    $("#title").textContent = l.posisi;
    $("#sub").textContent = l.instansi;
    v.innerHTML = `${l.contoh ? note : ""}<div class="job-detail">
      <article class="article" style="margin:0">
        <h2 class="h2" style="font-size:1.3rem">Deskripsi</h2><p>${esc(l.ringkas)}</p>
        ${l.syarat ? `<h2 class="h2" style="font-size:1.3rem;margin-top:28px">Persyaratan</h2><ul>${l.syarat.split("\n").filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        <div class="article-foot"><a class="link" href="karier.html" id="back">${ic("arrow")} Semua lowongan</a></div>
      </article>
      <aside class="job-side">
        <dl><div><dt>Jenis</dt><dd>${esc(l.jenis)}</dd></div><div><dt>Instansi</dt><dd>${esc(l.instansi)}</dd></div><div><dt>Lokasi</dt><dd>${esc(l.lokasi)}</dd></div><div><dt>Batas lamaran</dt><dd>${fmtDate(l.batas)}${lewat ? " (sudah ditutup)" : ""}</dd></div></dl>
        ${l.tautan && !lewat ? `<a class="btn btn-primary" style="width:100%" href="${esc(l.tautan)}" target="_blank" rel="noopener">Lamar sekarang ${ic("external")}</a>`
          : `<a class="btn btn-navy" style="width:100%" href="kontak.html">Tanya program studi</a>`}
      </aside></div>`;
    $("#back .icon").style.transform = "rotate(180deg)";
    return;
  }

  let f = "Semua";
  v.innerHTML = `${note}<div class="toolbar">
      <div class="chips" id="k">${["Semua", "Kerja", "Magang"].map(k => `<button class="chip" data-k="${k}">${k}</button>`).join("")}</div>
      <label class="search"><span class="sr-only">Cari lowongan</span>${ic("search")}<input class="input" id="q" type="search" placeholder="Cari posisi atau instansi"></label>
    </div>
    <div class="grid g3" id="g"></div><p class="empty" id="e" hidden>Belum ada lowongan yang sesuai.</p>`;
  const render = () => {
    const q = $("#q").value.trim().toLowerCase();
    $$("#k .chip").forEach(c => c.classList.toggle("on", c.dataset.k === f));
    const list = all.filter(l => (f === "Semua" || l.jenis === f) && (l.posisi + " " + l.instansi + " " + l.lokasi).toLowerCase().includes(q));
    $("#e").hidden = list.length > 0;
    $("#g").innerHTML = list.map(jobCard).join("");
    $$("#g .reveal").forEach(el => el.classList.add("in"));
  };
  $("#k").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { f = c.dataset.k; render(); } });
  $("#q").addEventListener("input", render);
  render();
};
</script>
</body>
</html>
