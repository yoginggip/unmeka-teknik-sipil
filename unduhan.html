<script>
window.pageInit = function () {
  const L = D.unduhan, kats = [...new Set(L.map(x => x.kat))];
  const row = x => `<div class="dlr reveal"><span class="ft">${esc(x.jenis)}</span><div class="dl-t"><b>${esc(x.judul)}</b><small>${esc(x.ket)}</small></div>
    ${x.url ? `<a class="btn btn-outline btn-sm go" href="${esc(x.url)}" target="_blank" rel="noopener">${ic(x.jenis === "Tautan" ? "external" : "download")} ${x.jenis === "Tautan" ? "Buka" : "Unduh"}</a>` : `<span class="na">Segera tersedia</span>`}</div>`;
  $("#view").innerHTML = (L.some(x => x.contoh) ? `<p class="job-note">${ic("info")}<span>Dokumen bertanda <b>Contoh</b> menunggu berkas resmi dari program studi. Tombol unduh aktif setelah berkas diunggah.</span></p>` : "")
    + kats.map(k => `<div class="dl-group"><h2>${k}</h2>${L.filter(x => x.kat === k).map(row).join("")}</div>`).join("");
  $$("#view .reveal").forEach(el => el.classList.add("in"));
};
</script>
