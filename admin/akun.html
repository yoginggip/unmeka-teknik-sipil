<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Akun Admin | Admin Teknik Sipil UNMEKA</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20261116zx"><link rel="stylesheet" href="admin.css?v=20261116zo">
</head>
<body>
<div id="app"></div>
<script src="../assets/js/data.js?v=20261116z"></script>
<script src="../assets/js/app.js?v=20261116zx"></script>
<script src="admin.js?v=20261116zo"></script>
<script>
window.pageInit = function () {
  if (!shell("Kelola Akun Admin", "")) return;
  crud({
    key: "admin_akun", noun: "Akun",
    rowClass: r => r.status === "Nonaktif" ? "muted" : "",
    cols: [
      { label: "Nama", render: r => `<div style="display:flex;gap:10px;align-items:center">${avatar(r.nama, 34)}<div><b style="color:var(--ink)">${esc(r.nama)}</b><div class="meta">${esc(r.email)}</div></div></div>` },
      { label: "Peran", render: r => `<span class="tag">${esc(r.peran)}</span>` },
      { label: "Status", render: r => `<span class="tag${r.status === "Aktif" ? " tag-ok" : ""}">${esc(r.status)}</span>` },
    ],
    fields: [
      { k: "nama", label: "Nama lengkap", req: true, full: true },
      { k: "email", label: "Email", type: "email", req: true },
      { k: "peran", label: "Peran", type: "select", options: ["Admin", "Super Admin"] },
      { k: "status", label: "Status", type: "select", options: ["Aktif", "Nonaktif"] },
      { k: "sandi", label: "Kata sandi awal / atur ulang", type: "password", help: "Kosongkan bila tidak diubah. Pada sistem produksi kata sandi disimpan terenkripsi (bcrypt)." },
    ],
  });
};
</script>
</body>
</html>
