<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Galeri | Admin Teknik Sipil UNMEKA</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20261116zu"><link rel="stylesheet" href="admin.css?v=20261116zo">
</head>
<body>
<div id="app"></div>
<script src="../assets/js/data.js?v=20261116z"></script>
<script src="../assets/js/app.js?v=20261116zp"></script>
<script src="admin.js?v=20261116zo"></script>
<script>
window.pageInit = function () {
  if (!shell("Galeri", "")) return;
  crud({
    key: "admin_galeri", noun: "Album",
    cols: [
      { label: "Sampul", render: r => r.foto?.length ? `<img class="thumb wide" src="${SRC(r.foto[0][0])}" alt="Sampul ${esc(r.judul)}">` : '<small class="meta">Kosong</small>' },
      { label: "Album", render: r => `<b style="color:var(--ink)">${esc(r.judul)}</b>${r.ket ? `<br><small class="meta">${esc(r.ket.length > 80 ? r.ket.slice(0, 80) + "…" : r.ket)}</small>` : ""}` },
      { label: "Kategori", render: r => `<span class="tag">${esc(r.kategori)}</span>` },
      { label: "Foto", render: r => `${(r.foto || []).length} foto` },
      { label: "Tanggal", render: r => `<span style="white-space:nowrap">${r.tanggal ? fmtDate(r.tanggal) : "-"}</span>` },
    ],
    fields: [
      { k: "judul", label: "Judul album", req: true, full: true },
      { k: "kategori", label: "Kategori", type: "select", options: ["Kegiatan", "Fasilitas"] },
      { k: "tanggal", label: "Tanggal kegiatan", type: "date", help: "Kosongkan bila tidak diketahui." },
      { k: "ket", label: "Keterangan", type: "textarea", rows: 2, full: true },
      { k: "foto", label: "Foto", type: "images", req: true, full: true, ratio: 4 / 3, max: 1200, help: "Bisa pilih banyak foto sekaligus. Foto otomatis dipotong ke rasio 4:3. Foto pertama menjadi sampul." },
    ],
  });
};
</script>
</body>
</html>
