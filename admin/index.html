<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Masuk Administrator | Teknik Sipil UNMEKA</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login">
  <div class="login-art">
    <img src="../assets/img/logo-white-330.png" alt="Universitas Nusa Megarkencana">
    <div><h2>Panel Administrator Program Studi Teknik Sipil</h2><p>Kelola berita, data dosen, dan pesan dari pengunjung situs.</p></div>
    <small style="color:#9fabc7">Universitas Nusa Megarkencana</small>
  </div>
  <div class="login-form">
    <form id="f" novalidate>
      <h1 style="font-size:1.6rem">Masuk</h1>
      <p class="meta" style="margin:6px 0 24px">Gunakan akun administrator program studi.</p>
      <div class="hint"><b>Akun demo prototipe</b><br>Email <code>admin@unmeka.ac.id</code>, kata sandi <code>admin123</code></div>
      <div id="err" role="alert"></div>
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="username" value="admin@unmeka.ac.id"></div>
      <div class="field"><label for="pw">Kata sandi</label><input class="input" id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn btn-navy" style="width:100%;justify-content:center;margin-top:6px" type="submit">Masuk</button>
      <p style="text-align:center;margin-top:20px;font-size:.88rem"><a class="link" href="../index.html">Kembali ke situs</a></p>
    </form>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
window.pageInit = function () {
  try { if (sessionStorage.getItem("unmeka_admin") === "1") location.replace("dashboard.html"); } catch {}
  $("#f").addEventListener("submit", e => {
    e.preventDefault();
    if ($("#em").value.trim() === "admin@unmeka.ac.id" && $("#pw").value === "admin123") {
      try { sessionStorage.setItem("unmeka_admin", "1"); } catch {}
      location.href = "dashboard.html";
    } else $("#err").innerHTML = `<div class="alert err">Email atau kata sandi tidak sesuai.</div>`;
  });
};
</script>
</body>
</html>
